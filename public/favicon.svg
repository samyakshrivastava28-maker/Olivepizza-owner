<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Pizza Slice -->
  <g transform="translate(0, -10)">
    <path d="M 140 130 Q 256 90 372 130 Q 380 148 360 156 Q 256 120 152 156 Q 132 148 140 130 Z" fill="url(#crustGrad)"/>
    <path d="M 152 152 Q 256 120 360 152 L 256 320 Z" fill="#FFB74D"/>
    <path d="M 152 152 Q 256 130 360 152 L 285 270 Q 260 250 256 320 Q 250 260 227 270 Z" fill="#FFA726" opacity="0.7"/>

    <circle cx="220" cy="180" r="18" fill="#D32F2F"/>
    <circle cx="295" cy="195" r="16" fill="#D32F2F"/>
    <circle cx="254" cy="245" r="14" fill="#D32F2F"/>

    <circle cx="180" cy="185" r="10" fill="#2E7D32"/>
    <circle cx="180" cy="185" r="5" fill="#141B2D"/>
    <circle cx="325" cy="165" r="9" fill="#1B5E20"/>
    <circle cx="325" cy="165" r="4.5" fill="#141B2D"/>
  </g>

  <!-- OWNER Badge -->
  <rect x="90" y="380" width="332" height="74" rx="22" fill="url(#goldBadge)"/>
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="8" fill="#1A0D00" text-anchor="middle">OWNER</text>
</svg>
