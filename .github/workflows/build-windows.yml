name: Build Windows — Owner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          node -e "const fs = require('fs'); if (!fs.existsSync('dist')) fs.mkdirSync('dist', {recursive: true}); if (fs.existsSync('frontend/dist')) fs.cpSync('frontend/dist', 'dist', {recursive: true});"
        env:
          VITE_API_BASE_URL: https://olivepizza-owner.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Owner-Windows-Installer
          path: dist-electron/*.exe
          retention-days: 30
      # Create or Update Unified GitHub Release (All Platforms)
      - name: Create or Update Unified GitHub Release
        id: create_unified_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner — Latest Release (All Platforms)"
          tag_name: "latest"
          files: dist-electron/*.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create Versioned GitHub Release
      - name: Create Versioned GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner Windows v1.0.${{ github.run_number }}"
          tag_name: "v1.0.${{ github.run_number }}-win"
          files: dist-electron/*.exe
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build status
        shell: pwsh
        run: |
          $files = Get-ChildItem dist-electron -Filter *.exe -ErrorAction SilentlyContinue
          if ($files) {
            "## Windows Build: WINDOWS_BUILD_READY`n**Files**: $($files.Name -join ', ')" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "## Windows Build: WINDOWS_BUILD_FAILED" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
