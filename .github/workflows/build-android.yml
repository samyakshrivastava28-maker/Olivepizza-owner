name: Build Android APK — Owner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Olive Pizza Owner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      # 3. Install root dependencies and build frontend web bundle
      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..
          mkdir -p dist
          cp -r frontend/dist/* dist/ || true
        env:
          VITE_API_BASE_URL: https://olivepizza-owner.onrender.com
          VITE_BACKEND_URL: https://olivepizza-owner.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 4. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Sync Capacitor Web Directory with Android native project
      - name: Sync Capacitor
        run: |
          mkdir -p dist
          cp -r frontend/dist/* dist/ || true
          npx --yes cap sync android

      # 7. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permissions
        run: chmod +x android/gradlew

      # 9. Automatic Versioning
      - name: Inject Version into Gradle
        run: |
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((100 + RUN_NUM))
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${RUN_NUM}\"/g" android/app/build.gradle

      # 10. Prepare Signing Keystore
      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}'
        run: |
          KEYSTORE_PATH="android/app/release.keystore"
          VALID_KEYSTORE=false

          # 1. Try decoding KEYSTORE_BASE64 secret if available
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$KEYSTORE_PATH.tmp" 2>/dev/null || true
            if [ -s "$KEYSTORE_PATH.tmp" ]; then
              if keytool -list -keystore "$KEYSTORE_PATH.tmp" -storepass olivepizza -alias olivepizza >/dev/null 2>&1; then
                mv "$KEYSTORE_PATH.tmp" "$KEYSTORE_PATH"
                VALID_KEYSTORE=true
                echo "✅ Successfully decoded and verified keystore from KEYSTORE_BASE64 secret."
              fi
            fi
            rm -f "$KEYSTORE_PATH.tmp"
          fi

          # 2. Check committed keystore in repository
          if [ "$VALID_KEYSTORE" = false ] && [ -f "$KEYSTORE_PATH" ]; then
            if keytool -list -keystore "$KEYSTORE_PATH" -storepass olivepizza -alias olivepizza >/dev/null 2>&1; then
              VALID_KEYSTORE=true
              echo "✅ Verified existing release.keystore from repository."
            fi
          fi

          if [ "$VALID_KEYSTORE" = false ]; then
            echo "❌ No valid release.keystore found!"
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storepass olivepizza -alias olivepizza \
            && echo "✅ Keystore ready and verified — alias 'olivepizza' found."

      # 11. Build Signed Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # 12. Verify the APK is properly signed
      - name: Verify APK Signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ app-release.apk not found. Checking directory:"
            ls android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK found ($SIZE)"
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$APK" \
            && echo "✅ APK is properly signed." \
            || { echo "❌ APK signature verification FAILED — APK is unsigned or corrupted."; exit 1; }

      # 13. Rename APK for easy identification
      - name: Rename APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk artifact/OlivePizza-Owner-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifact/OlivePizza-Owner-release.apk

      # 14. Upload APK as GitHub Actions artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizzaOwner-Android-APK
          path: artifact/*.apk
          retention-days: 90

      # 15. Create or Update Unified GitHub Release (All Platforms)
      - name: Create or Update Unified GitHub Release
        id: create_unified_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner — Latest Release (All Platforms)"
          tag_name: "latest"
          files: artifact/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 15b. Create Versioned GitHub Release
      - name: Create Versioned GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner v1.0.${{ github.run_number }}"
          tag_name: "v1.0.${{ github.run_number }}-apk"
          files: artifact/*.apk
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 16. Build Summary
      - name: Build Summary
        run: |
          echo "## 👑 Olive Pizza Owner Android Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ ANDROID_APK_READY" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** OlivePizzaOwner-Android-APK (available under Actions > Artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`in.olivepizza.owner\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File:** \`artifact/OlivePizza-Owner-v1.0.${{ github.run_number }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Keystore:** Stable Release Keystore (SHA1: 4C:6B:4A:1E:7D:43:96:6D:74:82:17:5F:08:D8:87:E5:3B:C4:B5:7E)" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Endpoint:** https://olivepizza-owner.onrender.com" >> $GITHUB_STEP_SUMMARY
