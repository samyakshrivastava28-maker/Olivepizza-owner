name: Build Android APK — Owner

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Olive Pizza Owner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      # 3. Install root dependencies and build frontend web bundle
      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..
          mkdir -p dist
          cp -r frontend/dist/* dist/ || true
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://olivepizza-owner.onrender.com' }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://olivepizza-owner.onrender.com' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 4. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      # 6. Sync Capacitor Web Directory with Android native project
      - name: Sync Capacitor
        run: |
          mkdir -p dist
          cp -r frontend/dist/* dist/ || true
          npx --yes cap sync android

      # 7. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permissions
        run: chmod +x android/gradlew

      # 9. Automatic Versioning (guarantees strictly increasing versionCode based on commit count)
      - name: Inject Version into Gradle
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_NUM))
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${COMMIT_NUM}\"/g" android/app/build.gradle

      # 10. Detect release signing availability
      - name: Detect Android Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "release_signing=true" >> "$GITHUB_OUTPUT"
            echo "✅ Android release signing secrets are available."
          else
            echo "release_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are unavailable; building a DEBUG APK for testing."
          fi

      # 11. Prepare Keystore
      - name: Prepare Keystore
        if: steps.signing.outputs.release_signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="android/app/release.keystore"
          PASS="${KEYSTORE_PASSWORD}"
          ALIAS="${KEY_ALIAS}"

          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "❌ Failed to decode KEYSTORE_BASE64 into $KEYSTORE_PATH"
            exit 1
          fi

          # Verify keystore integrity with provided credentials
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1 \
            || { echo "❌ Failed to verify keystore with alias '$ALIAS' and provided password!"; exit 1; }

          echo "✅ Keystore successfully prepared and verified from KEYSTORE_BASE64 secret."

      # 12. Build Signed Release APK
      - name: Build Release APK
        if: steps.signing.outputs.release_signing == 'true'
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}

      # 12b. Build Debug APK (test-only fallback)
      - name: Build Debug APK (test-only fallback)
        if: steps.signing.outputs.release_signing != 'true'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # 13. Verify APK
      - name: Verify APK
        env:
          RELEASE_SIGNING: ${{ steps.signing.outputs.release_signing }}
        run: |
          if [ "$RELEASE_SIGNING" = "true" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
            test -f "$APK" || { echo "::error::Signed release APK was not produced."; exit 1; }
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BUILD_TOOLS=$(ls "$SDK_DIR/build-tools" | sort -V | tail -1)
            "$SDK_DIR/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK" \
              || { echo "::error::Release APK signature verification failed."; exit 1; }
            echo "✅ Signed release APK verified."
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK" || { echo "::error::Debug test APK was not produced."; exit 1; }
            echo "✅ Debug/test APK produced successfully."
          fi

      # 14. Rename APK
      - name: Rename APK
        env:
          RELEASE_SIGNING: ${{ steps.signing.outputs.release_signing }}
        run: |
          mkdir -p artifact
          COMMIT_NUM=$(git rev-list --count HEAD)
          if [ "$RELEASE_SIGNING" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "artifact/olivepizza-owner-${COMMIT_NUM}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "artifact/olivepizza-owner.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/olivepizza-owner-debug-${COMMIT_NUM}.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/olivepizza-owner-debug.apk"
            # Canonical copy so standard download routes resolve
            cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/olivepizza-owner.apk"
          fi

      # 15. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizzaOwner-Android-APK-${{ steps.signing.outputs.release_signing == 'true' && 'Release' || 'Debug-Test' }}
          path: artifact/*.apk
          retention-days: 90

      # 16. Publish to GitHub Release
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING: ${{ steps.signing.outputs.release_signing }}
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          if [ "$RELEASE_SIGNING" = "true" ]; then
            APK_NAME="olivepizza-owner-${COMMIT_NUM}.apk"
          else
            APK_NAME="olivepizza-owner-debug-${COMMIT_NUM}.apk"
          fi
          echo "Publishing ${APK_NAME} and canonical olivepizza-owner.apk to release tag 'latest'..."

          # Ensure 'latest' release exists or create it
          gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create latest --repo "${GITHUB_REPOSITORY}" --title "Olive Pizza Owner — Latest Release" --notes "Latest official builds for Olive Pizza Owner."

          # Delete old commit-specific .apk assets from 'latest' release, preserving canonical
          OLD_APKS=$(gh release view latest --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.name | test("\\.apk$")) | .name')
          for old in $OLD_APKS; do
            if [ "$old" != "olivepizza-owner.apk" ] && [ "$old" != "olivepizza-owner-debug.apk" ] && [ "$old" != "${APK_NAME}" ]; then
              echo "Deleting old release asset: ${old}"
              gh release delete-asset latest "${old}" --repo "${GITHUB_REPOSITORY}" --yes || true
            fi
          done

          # Upload commit-specific APK, debug APK if applicable, and canonical APK
          gh release upload latest "artifact/${APK_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          if [ "$RELEASE_SIGNING" != "true" ] && [ -f "artifact/olivepizza-owner-debug.apk" ]; then
            gh release upload latest "artifact/olivepizza-owner-debug.apk" --repo "${GITHUB_REPOSITORY}" --clobber
          fi
          gh release upload latest "artifact/olivepizza-owner.apk" --repo "${GITHUB_REPOSITORY}" --clobber

      # 17. Build Summary
      - name: Build Summary
        env:
          RELEASE_SIGNING: ${{ steps.signing.outputs.release_signing }}
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          echo "## 👑 Olive Pizza Owner Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_SIGNING" = "true" ]; then
            echo "- **Status:** ✅ SIGNED_RELEASE_APK_READY" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK File:** \`olivepizza-owner-${COMMIT_NUM}.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Signing:** Verified with configured release keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** ⚠️ ANDROID_DEBUG_TEST_APK_READY" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK File:** \`olivepizza-owner-debug-${COMMIT_NUM}.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Signing:** Debug key (for testing; release signing secrets unconfigured)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Package ID:** \`in.olivepizza.owner\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend Endpoint:** https://olivepizza-owner.onrender.com" >> "$GITHUB_STEP_SUMMARY"

      # 18. Cleanup Keystore (Fail-Closed Sandbox Hygiene)
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          echo "🧹 Temporary release keystore removed."
