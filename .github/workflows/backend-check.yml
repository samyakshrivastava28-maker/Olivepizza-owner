name: Backend TypeScript and Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: olive_pizza_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/olive_pizza_test
      PORT: 5175
      NODE_ENV: test
      PG_SSL: 'false'
      DATABASE_ENV: testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Compile TypeScript
        run: npm run build
        working-directory: backend

      - name: Run database migrations
        run: npx tsx src/migrations/runner.ts
        working-directory: backend
        env:
          PG_SSL: 'false'
          DATABASE_ENV: testing

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          PG_SSL: 'false'
          DATABASE_ENV: testing
