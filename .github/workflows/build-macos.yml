name: Build macOS — Owner

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          node -e "import('fs').then(fs => { if (!fs.existsSync('dist')) fs.mkdirSync('dist', {recursive: true}); if (fs.existsSync('frontend/dist')) fs.cpSync('frontend/dist', 'dist', {recursive: true}); });"
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://olivepizza-owner.onrender.com' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npx electron-builder --mac --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Package macOS DMG
        run: |
          mkdir -p artifact
          COMMIT_NUM=$(git rev-list --count HEAD)
          TARGET_NAME="olivepizza-owner-${COMMIT_NUM}.dmg"
          
          echo "Listing all generated packages in dist-electron:"
          ls -la dist-electron/ || true

          # 1. Prefer Universal DMG as default primary DMG, fallback to first DMG found
          UNIVERSAL_DMG=$(ls dist-electron/*universal*.dmg 2>/dev/null | head -n 1)
          FIRST_DMG=$(ls dist-electron/*.dmg 2>/dev/null | head -n 1)

          if [ -n "$UNIVERSAL_DMG" ] && [ -f "$UNIVERSAL_DMG" ]; then
            cp "$UNIVERSAL_DMG" "artifact/${TARGET_NAME}"
            echo "✅ Packaged primary ${TARGET_NAME} from universal: ${UNIVERSAL_DMG}"
          elif [ -n "$FIRST_DMG" ] && [ -f "$FIRST_DMG" ]; then
            cp "$FIRST_DMG" "artifact/${TARGET_NAME}"
            echo "✅ Packaged primary ${TARGET_NAME} from ${FIRST_DMG}"
          else
            echo "⚠️ No DMG found in dist-electron!"
          fi

          ls -lh artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: OlivePizzaOwner-macOS-Installer
          path: artifact/*.dmg
          retention-days: 14
          if-no-files-found: error

      # Publish to GitHub Release (Only Latest Commit Files)
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          DMG_NAME="olivepizza-owner-${COMMIT_NUM}.dmg"
          echo "Publishing single latest DMG ${DMG_NAME} to release tag 'latest'..."

          # Ensure 'latest' release exists or create it
          gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create latest --repo "${GITHUB_REPOSITORY}" --title "Olive Pizza Owner — Latest Release" --notes "Latest official builds for Olive Pizza Owner."

          # Delete all existing .dmg assets from 'latest' release so ONLY the single latest commit DMG exists
          OLD_DMGS=$(gh release view latest --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.name | test("\\.dmg$")) | .name')
          for old in $OLD_DMGS; do
            if [ "$old" != "${DMG_NAME}" ]; then
              echo "Deleting old release asset: ${old}"
              gh release delete-asset latest "${old}" --repo "${GITHUB_REPOSITORY}" --yes || true
            fi
          done

          # Upload strictly the single latest commit DMG
          if [ -f "artifact/${DMG_NAME}" ]; then
            gh release upload latest "artifact/${DMG_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build status
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          if ls artifact/*.dmg 2>/dev/null; then
            echo "## macOS Build: MACOS_BUILD_READY — **File**: olivepizza-owner-${COMMIT_NUM}.dmg" >> $GITHUB_STEP_SUMMARY
          else
            echo "## macOS Build: MACOS_BUILD_FAILED" >> $GITHUB_STEP_SUMMARY
          fi
