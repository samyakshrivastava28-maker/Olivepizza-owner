name: Build iOS — Owner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'archive'
        type: choice
        options:
          - archive

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Project
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (bundled into app)
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_BASE_URL: https://olivepizza-owner.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Install CocoaPods (if Podfile exists)
        run: |
          cd ios/App
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install --repo-update
          else
            echo "Swift Package Manager project detected — skipping CocoaPods"
          fi

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build and Archive iOS
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET="-workspace App.xcworkspace"
          else
            TARGET="-project App.xcodeproj"
          fi
          xcodebuild \
            $TARGET \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ${{ github.workspace }}/OlivePizza-Owner.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | xcpretty || true

      - name: Export Signed IPA (if signing secrets exist)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Signing configured — exporting IPA..."
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > /tmp/certificate.p12
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -A
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain "$(security list-keychains -d user | head -1 | tr -d '"')"
          mkdir -p /tmp/ipa-export
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "${{ github.workspace }}/OlivePizza-Owner.xcarchive" \
            -exportPath /tmp/ipa-export \
            -exportOptionsPlist /tmp/ExportOptions.plist || true

      - name: Package Release Files
        run: |
          mkdir -p release-ios
          ARCHIVE_PATH="${{ github.workspace }}/OlivePizza-Owner.xcarchive"
          if [ -d "$ARCHIVE_PATH" ]; then
            echo "Packaging xcarchive bundle..."
            zip -r "release-ios/OlivePizza-Owner.xcarchive.zip" "$ARCHIVE_PATH"

            echo "Packaging unsigned IPA from archive..."
            mkdir -p /tmp/Payload
            cp -r "$ARCHIVE_PATH/Products/Applications/"*.app /tmp/Payload/ || true
            if [ -d "/tmp/Payload" ] && [ "$(ls -A /tmp/Payload)" ]; then
              cd /tmp
              zip -r "${{ github.workspace }}/release-ios/OlivePizza-Owner-unsigned.ipa" Payload
              cd ${{ github.workspace }}
              echo "✅ Unsigned IPA created."
            fi
          fi
          if [ -d "/tmp/ipa-export" ]; then
            cp -f /tmp/ipa-export/*.ipa release-ios/ || true
          fi
          ls -la release-ios/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Owner-iOS
          path: release-ios/*
          retention-days: 14

      # Create or Update Unified GitHub Release (All Platforms)
      - name: Create or Update Unified GitHub Release
        id: create_unified_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner — Latest Release (All Platforms)"
          tag_name: "latest"
          files: release-ios/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create Versioned GitHub Release
      - name: Create Versioned GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Olive Pizza Owner iOS v1.0.${{ github.run_number }}"
          tag_name: "v1.0.${{ github.run_number }}-ios"
          files: release-ios/*
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build status summary
        run: |
          echo "## iOS Build Result" >> $GITHUB_STEP_SUMMARY
          if ls release-ios/*.ipa 2>/dev/null; then
            echo "**Status**: ✅ IOS_BUILD_READY" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: ⚠️ ARCHIVE_READY (xcarchive packaged)" >> $GITHUB_STEP_SUMMARY
          fi
