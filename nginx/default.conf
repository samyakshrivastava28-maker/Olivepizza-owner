# ==============================================================================
# OLIVE PIZZA — NGINX REVERSE PROXY CONFIGURATION
# Production SSL termination, WebSocket upgrade & API routing
# ==============================================================================

upstream backend_upstream {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── HTTP -> HTTPS Redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.olivepizza.in _;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Reverse Proxy Server ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.olivepizza.in;

    # SSL Certificates (managed via external volume / certbot)
    ssl_certificate /etc/nginx/ssl/live/api.olivepizza.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.olivepizza.in/privkey.pem;

    # Modern SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client payload limit (accommodates high-res image and video uploads to Cloudinary gateway)
    client_max_body_size 60M;

    # Standard Proxy Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Standard Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ── WebSocket Fleet Telemetry & Live Order Updates ─────────────────────
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Healthcheck & Liveness Probes ──────────────────────────────────────
    location /health {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    location /health/live {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    location /health/ready {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    # ── REST API Proxy ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://backend_upstream;
    }
}
