# ==============================================================================
# OLIVE PIZZA — PRODUCTION HAPROXY LOAD BALANCER CONFIGURATION
# Reference: HAProxy 2.8+ / 3.0 LTS
#
# ARCHITECTURAL DESIGN:
# 1. INITIAL SINGLE-VPS:
#    - HAProxy binds public ports 80/443 (SSL termination, HTTP->HTTPS redirect).
#    - Routes traffic to local Node.js backend on 127.0.0.1:5000.
#    - PostgreSQL 18 (127.0.0.1:5432) and Redis 7.2 (127.0.0.1:6379) are PRIVATE.
#    - Data stores are NEVER exposed publicly or routed through HAProxy.
#
# 2. FUTURE HORIZONTAL SCALING:
#    - Backend nodes communicate over private WireGuard / VPC subnet (10.0.0.0/24).
#    - Prepared server slots (app_node_2, app_node_3, ...) enabled seamlessly via
#      runtime admin socket (/run/haproxy/admin.sock) with ZERO downtime and
#      ZERO changes to client-facing DNS / URLs.
#    - Health routing via active HTTP checks on /ready (expect status 200).
#    - Native WebSocket tunnel persistence with 1h timeouts and ALPN support.
# ==============================================================================

global
    log /dev/log local0 info
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 10000

    # Administrative runtime socket for seamless dynamic node management & draining
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # Modern TLS 1.2 & 1.3 Security Configuration (Mozilla Modern Profile)
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3

    # Connection and Request Timeouts
    timeout connect        5000ms
    timeout client         30000ms
    timeout server         30000ms
    timeout queue          30000ms
    timeout http-request   10000ms
    timeout http-keep-alive 10000ms
    timeout check          3000ms

    # Persistent WebSocket Streaming (Critical for 500ms driver GPS & live tracker)
    timeout tunnel         1h

# ------------------------------------------------------------------------------
# FRONTEND: HTTP (Port 80) — Automatic SSL Upgrade & ACME Challenge Pass-through
# ------------------------------------------------------------------------------
frontend http_in
    bind :80
    mode http

    # ACME Let's Encrypt automated certificate renewals
    acl is_acme path_beg /.well-known/acme-challenge/
    use_backend certbot_backend if is_acme

    # Canonical HTTPS Redirection
    http-request redirect scheme https code 301 unless is_acme

# ------------------------------------------------------------------------------
# FRONTEND: HTTPS (Port 443) — TLS Termination, Security Headers & Routing
# ------------------------------------------------------------------------------
frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/olivepizza.pem alpn h2,http/1.1
    mode http

    # Client IP and Forwarded Protocol Transmission
    option forwardfor header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Real-IP %[src]

    # Security Headers (Defense-in-Depth)
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Permissions-Policy "geolocation=(self), camera=(), microphone=()"

    # Request Body Size Limitation (20MB max body size guard against payload attacks)
    acl body_too_large req.hdr(content-length),int gt 20971520
    http-request deny deny_status 413 content-type "application/json" string '{"error":"Payload Too Large","maxSizeBytes":20971520}' if body_too_large

    # WebSocket Upgrade Protocol Detection
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_ws_path path_beg /ws

    # Routing Decisions
    use_backend olivepizza_websocket if is_websocket || is_ws_path
    default_backend olivepizza_api

# ------------------------------------------------------------------------------
# BACKEND: API HTTP REST Traffic
# ------------------------------------------------------------------------------
backend olivepizza_api
    mode http
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200

    # Compression for text, JSON, and SVG payloads
    compression algo gzip
    compression type application/json text/plain text/css application/javascript image/svg+xml

    # INITIAL NODE: Primary local backend instance on the initial VPS
    server app_node_1 127.0.0.1:5000 check inter 3000ms rise 2 fall 3 maxconn 500

    # HORIZONTAL SCALING NODES: Pre-configured cluster slots on private VPC (10.0.0.0/24)
    # Activated dynamically via admin socket: echo "enable server olivepizza_api/app_node_2" | socat /run/haproxy/admin.sock -
    server app_node_2 10.0.0.2:5000 check inter 3000ms rise 2 fall 3 maxconn 500 disabled
    server app_node_3 10.0.0.3:5000 check inter 3000ms rise 2 fall 3 maxconn 500 disabled
    server app_node_4 10.0.0.4:5000 check inter 3000ms rise 2 fall 3 maxconn 500 disabled

# ------------------------------------------------------------------------------
# BACKEND: Real-Time WebSocket Streaming (/ws)
# ------------------------------------------------------------------------------
backend olivepizza_websocket
    mode http
    balance leastconn
    timeout tunnel 1h
    option httpchk GET /live
    http-check expect status 200

    # WebSocket Node 1
    server app_node_1_ws 127.0.0.1:5000 check inter 5000ms rise 2 fall 3 maxconn 2500

    # Horizontal WebSocket Cluster Nodes
    server app_node_2_ws 10.0.0.2:5000 check inter 5000ms rise 2 fall 3 maxconn 2500 disabled
    server app_node_3_ws 10.0.0.3:5000 check inter 5000ms rise 2 fall 3 maxconn 2500 disabled
    server app_node_4_ws 10.0.0.4:5000 check inter 5000ms rise 2 fall 3 maxconn 2500 disabled

# ------------------------------------------------------------------------------
# BACKEND: Let's Encrypt ACME Renewal Helper
# ------------------------------------------------------------------------------
backend certbot_backend
    mode http
    server certbot 127.0.0.1:8888

# ------------------------------------------------------------------------------
# STATS INTERFACE (Restricted to Localhost / Admin Network)
# ------------------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE
