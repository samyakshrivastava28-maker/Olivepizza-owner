<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle / App Icon Frame) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="200" r="130" fill="#FF5722" opacity="0.12" filter="url(#glow)"/>

  <!-- Pizza Slice Illustration -->
  <g transform="translate(0, -10)">
    <!-- Pizza Crust Arc -->
    <path d="M 140 130 Q 256 90 372 130 Q 380 148 360 156 Q 256 120 152 156 Q 132 148 140 130 Z" fill="url(#crustGrad)" filter="url(#glow)"/>

    <!-- Pizza Body / Melted Cheese -->
    <path d="M 152 152 Q 256 120 360 152 L 256 320 Z" fill="#FFB74D"/>
    <!-- Cheese Flow details -->
    <path d="M 152 152 Q 256 130 360 152 L 285 270 Q 260 250 256 320 Q 250 260 227 270 Z" fill="#FFA726" opacity="0.7"/>

    <!-- Pepperoni & Olive Toppings -->
    <!-- Pepperoni 1 -->
    <circle cx="220" cy="180" r="18" fill="#D32F2F"/>
    <circle cx="218" cy="178" r="14" fill="#C62828"/>
    <circle cx="214" cy="174" r="3" fill="#E57373" opacity="0.7"/>

    <!-- Pepperoni 2 -->
    <circle cx="295" cy="195" r="16" fill="#D32F2F"/>
    <circle cx="293" cy="193" r="12" fill="#C62828"/>
    <circle cx="290" cy="190" r="2.5" fill="#E57373" opacity="0.7"/>

    <!-- Pepperoni 3 -->
    <circle cx="254" cy="245" r="14" fill="#D32F2F"/>
    <circle cx="253" cy="243" r="10" fill="#C62828"/>

    <!-- Olive Rings (Green & Black) -->
    <!-- Olive 1 -->
    <circle cx="180" cy="185" r="10" fill="#2E7D32"/>
    <circle cx="180" cy="185" r="5" fill="#141B2D"/>

    <!-- Olive 2 -->
    <circle cx="325" cy="165" r="9" fill="#1B5E20"/>
    <circle cx="325" cy="165" r="4.5" fill="#141B2D"/>

    <!-- Olive 3 -->
    <circle cx="230" cy="215" r="8" fill="#2E7D32"/>
    <circle cx="230" cy="215" r="4" fill="#141B2D"/>

    <!-- Melted Cheese Pull Drop -->
    <path d="M 253 318 C 253 335 259 335 259 318 Z" fill="#FFA726"/>
  </g>

  <!-- Crown / Star Accent above badge -->
  <path d="M 256 348 L 261 360 L 274 360 L 263 368 L 267 380 L 256 372 L 245 380 L 249 368 L 238 360 L 251 360 Z" fill="#FFD54F" filter="url(#glow)"/>

  <!-- "OWNER" Banner Badge Container -->
  <g transform="translate(0, 0)">
    <!-- Badge Drop Shadow -->
    <rect x="100" y="388" width="312" height="66" rx="20" fill="#000000" opacity="0.6" filter="url(#glow)"/>
    
    <!-- Badge Background with Gold Gradient -->
    <rect x="100" y="384" width="312" height="64" rx="20" fill="url(#goldBadge)"/>
    <rect x="102" y="386" width="308" height="60" rx="18" fill="none" stroke="#FFF9C4" stroke-width="2" stroke-opacity="0.8"/>

    <!-- "OWNER" Bold Text -->
    <text x="256" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="7" fill="#1A0D00" text-anchor="middle">OWNER</text>
  </g>
</svg>
