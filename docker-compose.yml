version: '3.8'

# ==============================================================================
# OLIVE PIZZA — PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Single Source of Truth architecture with PostgreSQL, Redis, Backend & NGINX
# ==============================================================================

services:
  # ── 1. Canonical Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olive_pizza_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres_secure_pass@postgres:5432/olive_pizza?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - FIREBASE_SERVICE_ACCOUNT_KEY=${FIREBASE_SERVICE_ACCOUNT_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-olive-pizza-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - AI_GATEWAY_SECRET=${AI_GATEWAY_SECRET}
      - ORDER_SIGNING_SECRET=${ORDER_SIGNING_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olive_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 2. Authoritative PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: olive_pizza_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olive_pizza}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - olive_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-olive_pizza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. High-Performance Redis (Cache, Coordination, Locks, Replay) ────────
  redis:
    image: redis:7-alpine
    container_name: olive_pizza_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - olive_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. NGINX Reverse Proxy & SSL Termination ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: olive_pizza_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - olive_network

networks:
  olive_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_etc:
  certbot_www:
